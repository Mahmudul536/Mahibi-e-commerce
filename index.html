<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahibi Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    font-size:2rem;
}

nav{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:10px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:50px 20px;
}

.hero h2{
    font-size:2rem;
    margin-bottom:10px;
}

.container{
    width:90%;
    margin:auto;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.price{
    color:green;
    font-size:1.2rem;
    font-weight:bold;
    margin:10px 0;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>
<body>

<header>
    <h1>🛒 Mahibi E-Commerce Store</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart</a>
        <a href="#">Login</a>
    </nav>
</header>

<section class="hero">
    <h2>Welcome To Mahibi Shop</h2>
    <p>Best Online Shopping Experience</p>
</section>
<div class="auth-box">

<h2>Register</h2>

<input type="email" id="regEmail" placeholder="Email">
<input type="password" id="regPassword" placeholder="Password">
<button onclick="register()">Register</button>

<br><br>

<h2>Login</h2>

<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPassword" placeholder="Password">
<button onclick="login()">Login</button>

<p id="status"></p>

</div>
<div class="container">
    <div class="products">

        <div class="card">
            <img src="https://picsum.photos/300/220?1">
            <div class="card-body">
                <h3>Smart Phone</h3>
                <div class="price">৳15000</div>
                <button>Add To Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/220?2">
            <div class="card-body">
                <h3>Headphone</h3>
                <div class="price">৳1200</div>
                <button>Add To Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/220?3">
            <div class="card-body">
                <h3>Laptop</h3>
                <div class="price">৳55000</div>
                <button>Add To Cart</button>
            </div>
        </div>

    </div>
</div>
<div id="productSection" style="display:none;">

<h2>Add Product</h2>

<input type="text" id="pname" placeholder="Product Name">
<input type="number" id="pprice" placeholder="Product Price">
<input type="text" id="pimage" placeholder="Image URL">

<button onclick="addProduct()">Add Product</button>

</div>

<div class="products" id="productList"></div>
<footer>
    <h3>Created By Md. Mahmudul Hasan (ICE, RU)</h3>
</footer>
<script>

function register(){

let email=document.getElementById("regEmail").value;
let password=document.getElementById("regPassword").value;

if(email==="" || password===""){
alert("সব তথ্য পূরণ করুন");
return;
}

let users=JSON.parse(localStorage.getItem("users")) || [];

let exists=users.find(u=>u.email===email);

if(exists){
alert("এই Email আগে থেকেই আছে");
return;
}

users.push({
email:email,
password:password
});

localStorage.setItem("users",JSON.stringify(users));

alert("Registration Successful");
}

function login(){

let email=document.getElementById("loginEmail").value;
let password=document.getElementById("loginPassword").value;

let users=JSON.parse(localStorage.getItem("users")) || [];

let user=users.find(
u=>u.email===email && u.password===password
);

if(user){

localStorage.setItem("loggedUser",email);

document.getElementById("status").innerHTML="✅ Login Successful";

// 👉 এটা গুরুত্বপূর্ণ অংশ
document.getElementById("productSection").style.display="block";

showProducts();

}
else{
document.getElementById("status").innerHTML="❌ Invalid Email or Password";
}
}
function addProduct(){

let name=document.getElementById("pname").value;
let price=document.getElementById("pprice").value;
let image=document.getElementById("pimage").value;

let products=JSON.parse(localStorage.getItem("products")) || [];

products.push({name,price,image});

localStorage.setItem("products",JSON.stringify(products));

showProducts();

alert("Product Added");

document.getElementById("pname").value="";
document.getElementById("pprice").value="";
document.getElementById("pimage").value="";
}

function showProducts(){

let products=JSON.parse(localStorage.getItem("products")) || [];

let html="";

products.forEach(p=>{
html += `
<div class="card">
<img src="${p.image}">
<div class="card-body">
<h3>${p.name}</h3>
<div class="price">৳${p.price}</div>
<button>Add To Cart</button>
</div>
</div>`;
});

document.getElementById("productList").innerHTML=html;
}

</script>
</body>
</html>
